<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>angelocheksss0</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f4ff; --card:#ffffff; --text:#1c1b29; --muted:#6b6880; --line:#e4e0f5;
  --accent:#4aa3ff; --accent2:#ff8fc4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13121c; --card:#1d1b2b; --text:#f1effa; --muted:#a09cb8; --line:#2c2940;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13121c; --card:#1d1b2b; --text:#f1effa; --muted:#a09cb8; --line:#2c2940;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; justify-content:center; padding:32px 16px 48px;
}
main{width:100%; max-width:440px; text-align:center}
.cover{
  width:100%; aspect-ratio:1/1; max-height:420px; object-fit:cover; object-position:center 30%;
  border-radius:24px; display:block; margin:0 0 -48px;
  box-shadow:0 12px 32px rgba(60,120,220,.25);
}
.avatar{
  position:relative; width:96px; height:96px; border-radius:50%; margin:0 auto 14px;
  border:4px solid var(--bg); background-size:cover; background-position:center 22%;
}
h1{margin:0 0 4px; font-size:24px}
.tag{margin:0 0 12px; color:var(--muted); font-size:15px}
.bio{margin:0 auto 24px; max-width:360px; line-height:1.5; font-size:15px}
.links{display:flex; flex-direction:column; gap:12px}
.link{
  display:flex; align-items:center; gap:14px; padding:14px 16px;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  color:var(--text); text-decoration:none; font-weight:600; font-size:16px;
  transition:transform .15s, border-color .15s;
}
.link:hover,.link:focus-visible{transform:translateY(-2px); border-color:var(--accent); outline:none}
.ico{
  width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
  color:#fff; flex:none; font-weight:800; font-size:18px;
}
.ico svg{width:22px; height:22px; fill:#fff}
.t{flex:1; text-align:left}
.t small{display:block; font-weight:400; color:var(--muted); font-size:13px}
.arrow{color:var(--muted)}
.qr{margin-top:20px; padding:18px 16px; background:var(--card); border:1px solid var(--line); border-radius:16px}
.qr p{margin:0 0 12px; font-size:14px; color:var(--muted)}
.qr img{width:200px; max-width:70%; height:auto; border-radius:12px; background:#fff; padding:8px; display:block; margin:0 auto}
.info{
  margin-top:24px; padding:16px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; text-align:left; font-size:14px; line-height:1.7;
}
.info b{display:inline-block; min-width:92px; color:var(--muted); font-weight:500}
footer{margin-top:28px; font-size:12px; color:var(--muted)}
</style>
</head>
